    <style>
        /* Desain Modern, Dark Theme & Neon Accents */
        :root {
            --bg-color: #050505;
            --card-bg: #111111;
            --card-border: #333333;
            --text-main: #ffffff;
            --text-muted: #888888;
            --neon-accent: #00e5ff; /* Cyan Neon */
            --neon-accent-2: #ff0055; /* Pink Neon */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
        }

        button {
            background: transparent;
            color: var(--neon-accent);
            border: 1px solid var(--neon-accent);
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        button:hover {
            background: var(--neon-accent);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--neon-accent);
        }

        /* Flashcard Grid Layout */
        .flashcard-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
        }

        /* 3D Flip Card CSS */
        .card {
            background-color: transparent;
            width: 100%;
            height: 200px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        /* Trigger Flip via Class */
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* Tampilan Depan (Kanji) */
        .card-front {
            border-bottom: 3px solid var(--neon-accent);
        }
        
        .card-front .kanji {
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--text-main);
            text-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .card-front .click-hint {
            position: absolute;
            bottom: 15px;
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.5;
        }

        /* Tampilan Belakang (Arti & Cara Baca) */
        .card-back {
            transform: rotateY(180deg);
            border-bottom: 3px solid var(--neon-accent-2);
            background: #0a0a0a;
        }

        .card-back .kana {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--neon-accent);
            margin-bottom: 5px;
        }

        .card-back .romaji {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            font-style: italic;
        }

        .card-back .meaning {
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: 500;
        }

        /* Animasi Muncul Pertama Kali */
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        /* Desain Tombol Back */
        .btn-back-global {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 350px;
            padding: 15px 20px;
            background-color: #0a0a0a;
            color: #888888;

            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.95rem;
            font-weight: 600;
            margin: 40px auto 0 auto;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-back-global:hover {
            color: #ffffff;
            background-color: #111111;
            border-color: #1e88e5; /* Warna aksen biru */
            box-shadow: 0 0 12px rgba(30, 136, 229, 0.4);
            transform: translateY(-2px);
        }

    </style>

        // Fungsi untuk membuat elemen HTML kartu
        function renderCards(dataArray) {
            container.innerHTML = '';

                const cardHTML = `
                    <div class="card fade-in" style="animation-delay: ${index * 0.02}s" onclick="this.classList.toggle('flipped')">

                                <div class="romaji">${data.romaji}</div>
                                <div class="meaning">${data.meaning}</div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // Fungsi Acak Kartu (Fisher-Yates Shuffle)
        function shuffleCards() {
            let shuffled = [...flashcardsData];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            renderCards(shuffled);
        }

        // Fungsi Reset (Menutup semua kartu & mengembalikan urutan)
        function resetCards() {
            renderCards(flashcardsData);
        }
