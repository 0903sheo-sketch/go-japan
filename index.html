<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gambar Full Layar (Ukuran Kecil)</title>
    
    <style>
        /* Menghilangkan margin bawaan browser dan memberi warna latar hitam */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #000000; /* Warna area kosong jika gambar tidak menutupi seluruh layar */
            overflow: hidden; /* Mencegah scrollbar */
        }

        .gambar-full {
            /* MASUKKAN LINK/NAMA FILE GAMBAR ANDA DI SINI */
            background-image: url('https://media.tenor.com/JL0JKYNTR6UAAAAM/gugugaga-penguin.gif'); /* Contoh gambar kecil */
            
            /* Mengatur tinggi elemen agar 100% dari tinggi layar HP/PC */
            height: 100vh;
            
            /* Memastikan gambar berada tepat di tengah layar */
            background-position: center;
            
            /* Mencegah gambar berulang */
            background-repeat: no-repeat;
            
            /* --- PENGATURAN UKURAN (Pilih salah satu) --- */
            
            /* Opsi 1 (Aktif): Menyesuaikan layar semaksimal mungkin tanpa terpotong */
            background-size: contain; 

            /* Opsi 2 (Hapus tanda /* di bawah ini jika ingin gambar tetap ukuran asli/tidak pecah) */
            /* background-size: auto; */
        }
    </style>
</head>
<body>

    <!-- Elemen yang menampilkan gambar -->
    <div class="gambar-full"></div>

</body>
</html>
