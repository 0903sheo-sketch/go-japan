<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <style>
        /* Desain Minimalis & Profesional */
        :root {
            --panel-bg: rgba(10, 10, 10, 0.85); 
            --border-color: #2a2a2a;
            --text-main: #ffffff;
            --text-muted: #999999;
            --accent-japan: #c91f37; 
            --accent-success: #2e7d32;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background-image: url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=2070&auto=format&fit=crop'); 
            background-size: cover; 
            background-position: center;
            background-attachment: fixed;
            background-color: #000000;
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow-x: hidden; 
            padding: 20px;
        }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            width: 100%;
            max-width: 750px;
            border-top: 3px solid var(--accent-japan);
            backdrop-filter: blur(8px);
            border-radius: 4px;
            position: relative;
        }

        h1, h2 { font-weight: 300; margin-bottom: 20px; text-align: center; letter-spacing: 1px; }
        .jp-title { color: var(--accent-japan); font-size: 1.2rem; margin-bottom: 10px; display: block; text-align: center; letter-spacing: 2px;}

        /* Header Info & Timer */
        .dash-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;}
        .points-badge { border: 1px solid var(--accent-japan); color: var(--accent-japan); padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; letter-spacing: 1px; display: inline-block;}
        
        .timer-box { font-size: 1.5rem; font-family: monospace; font-weight: bold; color: #fff; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 4px; border: 1px solid #444; }
        .timer-box.warning { color: var(--accent-japan); border-color: var(--accent-japan); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .btn-shuffle { background: transparent; border: 1px solid var(--text-muted); color: var(--text-main); padding: 5px 10px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; margin-left: 10px; transition: 0.2s;}
        .btn-shuffle:hover { border-color: #fff; background: rgba(255,255,255,0.1); }

        /* Audio Controls */
        .audio-box { text-align: center; margin-bottom: 30px; padding: 20px; border: 1px dashed var(--border-color); background: rgba(0, 0, 0, 0.4); border-radius: 4px;}
        .btn-play {
            background: var(--accent-japan); color: #fff; border: none; padding: 15px 30px; 
            font-size: 1.1rem; cursor: pointer; border-radius: 50px; font-weight: bold;
            display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s;
            width: 100%; max-width: 300px;
        }
        .btn-play:hover { background: #a0172b; transform: scale(1.05); }
        .btn-play:disabled { background: #555; cursor: not-allowed; transform: none; }
        
        .controls-group { display: flex; justify-content: center; gap: 20px; margin-top: 15px; flex-wrap: wrap;}
        .control-item { font-size: 0.9rem; color: var(--text-muted); display: flex; align-items: center; gap: 5px;}
        .control-item select { background: #111; color: #fff; border: 1px solid var(--border-color); padding: 5px; border-radius: 4px; outline: none; max-width: 150px;}

        /* Quiz Options */
        .question-text { font-size: 1.1rem; margin-bottom: 20px; text-align: center; color: #ddd; }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 20px; }
        
        /* Furigana Styling */
        ruby { font-size: 1.1rem; }
        rt { font-size: 0.6rem; color: #aaa; }
        
        .btn-option {
            background: rgba(0, 0, 0, 0.6); color: var(--text-main); border: 1px solid var(--border-color);
            padding: 15px; cursor: pointer; text-align: left; font-size: 1rem; border-radius: 4px;
            transition: 0.2s; line-height: 1.5;
        }
        .btn-option:hover { border-color: var(--accent-japan); background: rgba(20, 20, 20, 0.9); padding-left: 20px;}
        .btn-option.correct { background: rgba(46, 125, 50, 0.3); border-color: var(--accent-success); color: #fff; }
        .btn-option.correct rt { color: #ddd; }
        .btn-option.wrong { background: rgba(201, 31, 55, 0.3); border-color: var(--accent-japan); color: #fff; }

        .btn-next {
            width: 100%; padding: 15px; background: #111; color: var(--text-main);
            border: 1px solid var(--border-color); cursor: pointer; text-transform: uppercase;
            letter-spacing: 2px; transition: 0.2s; font-weight: bold; display: none; margin-bottom: 10px;
        }
        .btn-next:hover { background: #222; border-color: #555; }

        /* Result Screen */
        .result-box { text-align: center; display: none; }
        .final-score { font-size: 4rem; color: var(--accent-japan); font-weight: bold; margin: 20px 0; }
        .score-info { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; }

        /* Tombol Back */
        .btn-back-pojok {
            position: fixed; top: 20px; left: 20px; background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--accent-japan); color: var(--accent-japan);
            padding: 10px 20px; border-radius: 30px; cursor: pointer;
            font-size: 14px; font-weight: bold; transition: 0.3s; z-index: 9999; backdrop-filter: blur(5px);
        }
        .btn-back-pojok:hover { background: var(--accent-japan); color: #fff; box-shadow: 0 0 15px rgba(201, 31, 55, 0.5); }
    </style>
</head>

                    ],
                    options: ["<ruby>青<rt>あお</rt></ruby>い<ruby>帽子<rt>ぼうし</rt></ruby>", "<ruby>赤<rt>あか</rt></ruby>い<ruby>帽子<rt>ぼうし</rt></ruby>", "<ruby>白<rt>しろ</rt></ruby>い<ruby>帽子<rt>ぼうし</rt></ruby>", "<ruby>黒<rt>くろ</rt></ruby>い<ruby>帽子<rt>ぼうし</rt></ruby>"],

                },
                {

                    ],
                    options: ["すぐ<ruby>帰<rt>かえ</rt></ruby>る", "<ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>る", "<ruby>図書館<rt>としょかん</rt></ruby>へ<ruby>行<rt>い</rt></ruby>く", "<ruby>本<rt>ほん</rt></ruby>を<ruby>買<rt>か</rt></ruby>う"],
                    answer: 2
                },
                {
                    dialog: [
                        { speaker: 'F', text: '学校で先生が話しています。来週の授業はどこでありますか。' },
                        { speaker: 'F', text: '来週の火曜日は、この教室ではなく、3階のコンピュータールームで授業をします。間違えないでくださいね。' }
                    ],
                    options: ["いつもの<ruby>教室<rt>きょうしつ</rt></ruby>", "3<ruby>階<rt>かい</rt></ruby>の<ruby>教室<rt>きょうしつ</rt></ruby>", "3<ruby>階<rt>かい</rt></ruby>のコンピュータールーム", "<ruby>図書館<rt>としょかん</rt></ruby>"],
                    answer: 2
                },
                {
                    dialog: [
                        { speaker: 'F', text: '男の人と女の人が話しています。どうしてケーキを買いますか。' },
                        { speaker: 'M', text: 'あ、あそこのケーキ屋、美味しそうだね。買って帰ろうか。' },
                        { speaker: 'F', text: '今日は誰かの誕生日だった？' },
                        { speaker: 'M', text: 'ううん。でも、今週は仕事が大変だったから、頑張った自分へのプレゼントだよ。' }
                    ],
                    options: ["<ruby>誰<rt>だれ</rt></ruby>かの<ruby>誕生日<rt>たんじょうび</rt></ruby>だから", "<ruby>自分<rt>じぶん</rt></ruby>へのプレゼント", "お<ruby>客<rt>きゃく</rt></ruby>さんが<ruby>来<rt>く</rt></ruby>るから", "ケーキが<ruby>安<rt>やす</rt></ruby>いから"],
                    answer: 1
                },
                {
                    dialog: [
                        { speaker: 'F', text: '女の人が話しています。女の人はどんな犬を飼っていますか。' },
                        { speaker: 'F', text: '私の家には犬がいます。耳が長くて、足が短いです。毛は白くてフワフワしています。とても可愛いです。' }
                    ],
                    options: ["<ruby>耳<rt>みみ</rt></ruby>が<ruby>長<rt>なが</rt></ruby>くて、<ruby>足<rt>あし</rt></ruby>が<ruby>短<rt>みじか</rt></ruby>い", "<ruby>耳<rt>みみ</rt></ruby>が<ruby>短<rt>みじか</rt></ruby>くて、<ruby>足<rt>あし</rt></ruby>が<ruby>長<rt>なが</rt></ruby>い", "<ruby>毛<rt>け</rt></ruby>が<ruby>黒<rt>くろ</rt></ruby>い", "<ruby>大<rt>おお</rt></ruby>きい<ruby>犬<rt>いぬ</rt></ruby>"],
                    answer: 0
                }
        ];

        let questionsDB = [...originalQuestionsDB];
        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswered = false;
        
        // Timer Variables
        let timerInterval;
        let timeLeft = 35 * 60; // 35 menit
        
        // Audio Sequence Variables
        let maleVoice = null;
        let femaleVoice = null;
        let currentSequenceIndex = 0;
        let isPlaying = false;
        let dialogQueue = [];

        const optionsContainer = document.getElementById('options-container');
        const btnNext = document.getElementById('btn-next');
        const btnPlay = document.getElementById('btn-play');
        const progressText = document.getElementById('progress-text');
        const timerDisplay = document.getElementById('timer-display');

        // Mendeteksi dan Menyaring Suara Pria/Wanita dari Sistem
        function detectVoices() {
            const voices = window.speechSynthesis.getVoices().filter(v => v.lang.includes('ja'));
            if (voices.length === 0) return;

            // Cari suara pria berdasarkan kata kunci nama
            maleVoice = voices.find(v => {
                const n = v.name.toLowerCase();
                return n.includes('male') || n.includes('ichiro') || n.includes('otoya') || n.includes('keita') || n.includes('tarou');
            });

            // Cari suara wanita berdasarkan kata kunci nama
            femaleVoice = voices.find(v => {
                const n = v.name.toLowerCase();
                return n.includes('female') || n.includes('ayumi') || n.includes('haruka') || n.includes('kyoko') || n.includes('nanami');
            });

            // Fallback: Jika tidak terdeteksi spesifik, bagi suara apa adanya
            if (!maleVoice && voices.length > 0) maleVoice = voices[0];
            if (!femaleVoice && voices.length > 0) {
                const fallback = voices.find(v => v.name !== maleVoice.name);
                femaleVoice = fallback ? fallback : voices[0]; 
            }
        }

        // Web Speech API trigger
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = detectVoices;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.textContent = "00:00";
                    stopAudio();
                    alert("Waktu habis! Evaluasi akan diakhiri otomatis.");
                    showResult();
                } else {
                    timeLeft--;
                    let m = Math.floor(timeLeft / 60);
                    let s = timeLeft % 60;
                    timerDisplay.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    if(timeLeft < 300) {
                        timerDisplay.classList.add('warning');
                    }
                }
            }, 1000);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function shuffleQuiz() {
            if(confirm("Acak ulang soal? Ujian akan dimulai dari awal.")) {
                stopAudio();
                shuffleArray(questionsDB);
                currentQuestionIndex = 0;
                score = 0;
                timeLeft = 35 * 60;
                timerDisplay.classList.remove('warning');
                loadQuestion();
                startTimer();
            }
        }

        function loadQuestion() {
            isAnswered = false;
            btnNext.style.display = "none";
            btnPlay.disabled = false;
            btnPlay.textContent = "🔊 Putar Percakapan";
            progressText.textContent = `${currentQuestionIndex + 1}/${questionsDB.length}`;
            
            stopAudio();

            const currentQ = questionsDB[currentQuestionIndex];
            optionsContainer.innerHTML = "";

            currentQ.options.forEach((optionHTML, index) => {
                const btn = document.createElement("button");
                btn.className = "btn-option";
                btn.innerHTML = `<strong>${index + 1}.</strong> &nbsp; ${optionHTML}`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function stopAudio() {
            isPlaying = false;
            window.speechSynthesis.cancel();
        }

        function playAudio() {
            if (!window.speechSynthesis) return alert("Browser tidak mendukung TTS.");
            
            // Re-detect just in case
            if(!maleVoice || !femaleVoice) detectVoices();
            
            stopAudio();
            dialogQueue = questionsDB[currentQuestionIndex].dialog;
            currentSequenceIndex = 0;
            isPlaying = true;
            
            btnPlay.textContent = "Sedang Memutar... 🎧";
            btnPlay.disabled = true;
            
            playNextDialog();
        }

        // Fungsi Rekursif untuk Memutar Dialog secara bergantian
        function playNextDialog() {
            if (currentSequenceIndex >= dialogQueue.length || !isPlaying) {
                btnPlay.textContent = "🔄 Putar Ulang Percakapan";
                btnPlay.disabled = false;
                isPlaying = false;
                return;
            }

            const part = dialogQueue[currentSequenceIndex];
            const utterance = new SpeechSynthesisUtterance(part.text);
            utterance.lang = 'ja-JP';
            
            // Setel suara berdasarkan metadata skenario ('M' atau 'F')
          // Setel suara berdasarkan metadata skenario ('M' atau 'F') - SUARA DIBALIK
            if (part.speaker === 'M' && femaleVoice) utterance.voice = femaleVoice;
            else if (part.speaker === 'F' && maleVoice) utterance.voice = maleVoice;
            
            utterance.rate = parseFloat(document.getElementById('speed').value);
            
            utterance.onend = () => {
                currentSequenceIndex++;
                playNextDialog();
            };

            utterance.onerror = (e) => {
                if(e.error !== 'canceled') {
                    btnPlay.textContent = "🔄 Putar Ulang Percakapan";
                    btnPlay.disabled = false;
                    isPlaying = false;
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (isAnswered) return; 
            isAnswered = true;
            
            stopAudio(); // Hentikan audio saat pengguna memilih jawaban

            const currentQ = questionsDB[currentQuestionIndex];
            const allButtons = optionsContainer.querySelectorAll('.btn-option');

            if (selectedIndex === currentQ.answer) {
                btnElement.classList.add('correct');
                // Penilaian Maksimal JLPT N4 Choukai adalah 60. (60 / total soal)
                score += (60 / questionsDB.length); 
            } else {
                btnElement.classList.add('wrong');
                allButtons[currentQ.answer].classList.add('correct');
            }

            allButtons.forEach(b => b.style.cursor = "default");
            btnNext.style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questionsDB.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            clearInterval(timerInterval);
            document.getElementById('quiz-screen').style.display = "none";
            const resultScreen = document.getElementById('result-screen');
            resultScreen.style.display = "block";
            
            const finalScore = Math.round(score);
            document.getElementById('final-score').textContent = finalScore + " / 60";
            
            const feedback = document.getElementById('feedback-message');
            
            // Standar Kelulusan JLPT N4 Listening adalah 19 ke atas
            if (finalScore >= 45) {
                feedback.textContent = "Luar Biasa! Kemampuan pendengaran Anda sangat siap untuk Ujian Asli.";
                feedback.style.color = "var(--accent-success)";
                document.getElementById('final-score').style.color = "var(--accent-success)";
            } else if (finalScore >= 19) {
                feedback.textContent = "Lulus (Pass). Anda memenuhi standar minimal JLPT N4, namun tetap pertajam latihan Anda.";
                feedback.style.color = "#4caf50";
            } else {
                feedback.textContent = "Gagal (Fail). Skor Anda di bawah standar kelulusan (19 Poin). Jangan menyerah dan banyaklah mendengar bahasa Jepang!";
                feedback.style.color = "var(--accent-japan)";
                document.getElementById('final-score').style.color = "var(--accent-japan)";
            }
        }

        window.onload = () => {
            detectVoices();
            loadQuestion();
            startTimer();
        };
    </script>
