<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gowes Blitar Route Maker</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: Arial, sans-serif;
        }
        #map { 
            height: 100vh; 
            width: 100%; 
        }
        .header {
            position: absolute;
            top: 15px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border-top: 4px solid #ff69b4; 
        }
        .header h3 { margin: 0 0 10px 0; }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        input {
            padding: 8px;
            width: 100px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        input:focus {
            border-color: #ff69b4;
        }
        button {
            padding: 8px 15px;
            background-color: #ff69b4; 
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #ff1493;
        }
        /* Tombol Google Maps (Awalnya disembunyikan) */
        #btnGoogleMaps {
            display: none; 
            background-color: #4285F4; /* Warna biru khas Google */
            width: 100%;
        }
        #btnGoogleMaps:hover {
            background-color: #3367d6;
        }
    </style>
</head>
<body>

    <div class="header">
        <h3>Rute Gowes Blitar</h3>
        <div class="input-group">
            <input type="number" id="jarakKm" placeholder="Jarak (Km)" min="1">
            <button onclick="buatRuteGowes()">Buat Rute GPS</button>
        </div>
        <!-- Tombol ini akan muncul setelah rute berhasil dibuat -->
        <button id="btnGoogleMaps">Buka di Aplikasi Maps HP</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <script>
        var map = L.map('map').setView([-8.0954, 112.1609], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var routingControl = L.Routing.control({
            waypoints: [],
            routeWhileDragging: true,
            show: false 
        }).addTo(map);

        routingControl.on('routingerror', function(e) {
            alert("Gagal menemukan rute raya! Titik mungkin berada di area tanpa jalan. Silakan klik tombol 'Buat Rute GPS' lagi.");
            console.error("Detail Error:", e);
        });

        function buatRuteGowes() {
            var targetKm = document.getElementById('jarakKm').value;
            
            if (!targetKm || targetKm <= 0) {
                alert("Masukkan angka jarak yang valid!");
                return;
            }

            // Meminta akses GPS (Geolocation) dari browser HP/Laptop
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    
                    // Mengambil titik lokasi kamu saat ini
                    var startLat = position.coords.latitude;
                    var startLng = position.coords.longitude;
                    
                    // Pusatkan peta ke lokasi kamu
                    map.setView([startLat, startLng], 14);

                    var radiusKm = targetKm / 3.5; 
                    var radiusDeg = radiusKm / 111;

                    var angle1 = Math.random() * 2 * Math.PI;
                    var angle2 = angle1 + (Math.PI / 2.5); 

                    var wp1Lat = startLat + (radiusDeg * Math.cos(angle1));
                    var wp1Lng = startLng + (radiusDeg * Math.sin(angle1));

                    var wp2Lat = startLat + (radiusDeg * Math.cos(angle2));
                    var wp2Lng = startLng + (radiusDeg * Math.sin(angle2));

                    routingControl.setWaypoints([
                        L.latLng(startLat, startLng),
                        L.latLng(wp1Lat, wp1Lng),
                        L.latLng(wp2Lat, wp2Lng),
                        L.latLng(startLat, startLng)
                    ]);

                    // Membuat URL untuk dilempar ke aplikasi Google Maps
                    var gmapsUrl = `https://www.google.com/maps/dir/${startLat},${startLng}/${wp1Lat},${wp1Lng}/${wp2Lat},${wp2Lng}/${startLat},${startLng}`;
                    
                    // Menampilkan tombol Buka di Maps
                    var btnMaps = document.getElementById('btnGoogleMaps');
                    btnMaps.style.display = 'block';
                    btnMaps.onclick = function() {
                        window.open(gmapsUrl, '_blank');
                    };

                }, function(error) {
                    alert("Gagal mendapatkan lokasi. Pastikan GPS di HP aktif dan browser diizinkan mengakses lokasi.");
                });
            } else {
                alert("Browser ini tidak mendukung fitur lokasi (GPS).");
            }
        }
    </script>
</body>
</html>
