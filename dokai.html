<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongo Master | Simulasi JLPT N4 (Moji-Goi & Bunpou)</title>
    <style>
        /* Desain Minimalis & Profesional */
        :root {
            --bg-solid: #000000;
            --panel-bg: rgba(10, 10, 10, 0.85); 
            --border-color: #222222;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --accent-japan: #c91f37; 
            --accent-success: #2e7d32;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background-image: url('https://images.unsplash.com/photo-1528360983277-13d401cdc186?q=80&w=2070&auto=format&fit=crop'); 
            background-size: cover; 
            background-position: center;
            background-attachment: fixed;
            background-color: var(--bg-solid);
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow-x: hidden; 
            padding: 20px;
        }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            width: 100%;
            max-width: 750px;
            border-top: 3px solid var(--accent-japan);
            border-radius: 4px;
            backdrop-filter: blur(5px);
            position: relative;
        }

        h1, h2 { font-weight: 300; margin-bottom: 20px; text-align: center; letter-spacing: 1px; }
        .jp-title { color: var(--accent-japan); font-size: 1.2rem; margin-bottom: 5px; display: block; text-align: center; letter-spacing: 2px;}

        /* Header Info & Timer */
        .dash-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;}
        .points-badge { border: 1px solid var(--accent-japan); color: var(--accent-japan); padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; letter-spacing: 1px; display: inline-block;}
        
        .timer-box { font-size: 1.5rem; font-family: monospace; font-weight: bold; color: #fff; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 4px; border: 1px solid #444; }
        .timer-box.warning { color: var(--accent-japan); border-color: var(--accent-japan); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Tombol Acak Soal */
        .btn-shuffle {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-main);
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 8px;
            transition: 0.2s;
            display: inline-block;
        }
        .btn-shuffle:hover {
            border-color: #fff;
            background: rgba(255,255,255,0.1);
        }

        /* Furigana & Kanji Target Styling */
        ruby { font-size: 1.25rem; }
        rt { font-size: 0.7rem; color: #aaa; }
        .kanji-target { font-size: 1.3rem; border-bottom: 2px solid var(--accent-japan); padding: 0 4px; font-weight: bold; color: #fff; }
        
        .question-text { font-size: 1.25rem; margin-bottom: 30px; text-align: left; color: #fff; line-height: 1.8; }
        .question-text span.blank { display: inline-block; width: 60px; border-bottom: 2px solid var(--text-main); margin: 0 5px;}
        
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 25px; }
        .btn-option {
            background: rgba(0, 0, 0, 0.7); color: var(--text-main); border: 1px solid var(--border-color);
            padding: 15px 18px; cursor: pointer; text-align: left; font-size: 1.1rem; border-radius: 4px;
            transition: 0.2s; line-height: 1.6;
        }
        .btn-option:hover { border-color: var(--text-main); background: rgba(20, 20, 20, 0.9); padding-left: 22px;}
        .btn-option.correct { background: rgba(46, 125, 50, 0.4); border-color: var(--accent-success); color: #fff; }
        .btn-option.correct rt { color: #ddd; }
        .btn-option.wrong { background: rgba(201, 31, 55, 0.4); border-color: var(--accent-japan); color: #fff; }

        .btn {
            width: 100%; padding: 15px; background: #111; color: var(--text-main);
            border: 1px solid var(--border-color); cursor: pointer; text-transform: uppercase;
            letter-spacing: 2px; transition: 0.2s; font-weight: bold; margin-bottom: 10px;
        }
        .btn:hover { background: #222; border-color: #555; }
        .btn-next { display: none; margin-bottom: 15px; background: var(--accent-japan); border-color: var(--accent-japan); }
        .btn-next:hover { background: #a0172b; }

        .result-box { text-align: center; display: none; }
        .final-score { font-size: 5rem; color: var(--accent-japan); font-weight: 300; margin: 20px 0; }
        .score-desc { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 40px;}

        /* Tombol Back Pojok Kiri Atas */
        .btn-back-pojok {
            position: fixed; top: 20px; left: 20px; background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--accent-japan); color: var(--accent-japan);
            padding: 10px 20px; border-radius: 30px; cursor: pointer;
            font-size: 14px; font-weight: bold; transition: 0.3s; z-index: 9999; backdrop-filter: blur(5px);
        }
        .btn-back-pojok:hover { background: var(--accent-japan); color: #fff; box-shadow: 0 0 15px rgba(201, 31, 55, 0.5); }
    </style>
</head>
<body>

    <button class="btn-back-pojok" onclick="window.history.back()">⬅ Kembali</button>

    <div class="panel fade-in" id="quiz-container">
        <div class="dash-header">
            <div>
                <span class="jp-title">言語知識（文字・語彙・文法）</span>
                <div style="font-size: 0.9rem; color: var(--text-muted);">Simulasi JLPT N4 (Max 100 Poin)</div>
            </div>
            
            <div class="timer-box" id="timer-display">35:00</div>

            <div style="text-align: right;">
                <div class="points-badge">SOAL: <span id="progress-text">1/50</span></div>
                <br>
                <button class="btn-shuffle" onclick="shuffleQuiz()">🔀 Acak Soal</button>
            </div>
        </div>

        <div id="quiz-screen">
            <div class="question-text" id="question-text">Memuat pertanyaan...</div>
            <div class="options-grid" id="options-container"></div>

            <button class="btn btn-next" id="btn-next" onclick="nextQuestion()">Lanjut ke Soal Berikutnya ➔</button>
            <button class="btn" style="background: transparent; border-color: var(--border-color); color: var(--text-muted);" onclick="window.history.back()">⬅ Kembali ke Menu Utama</button>
        </div>

        <div id="result-screen" class="result-box">
            <h2>Evaluasi Selesai</h2>
            <div class="final-score" id="final-score">0</div>
            <div class="score-desc">Target Kelulusan Minimal: 38 / 100 Poin</div>
            <p id="feedback-message" style="color: var(--text-main); margin-bottom: 30px; font-size: 1.1rem; font-weight: bold;"></p>
            <button class="btn" style="background: var(--accent-japan); border-color: var(--accent-japan); margin-bottom: 10px;" onclick="shuffleQuiz()">Ulangi & Acak Ujian</button>
            <button class="btn" style="background: transparent; border-color: var(--border-color); color: var(--text-muted);" onclick="window.history.back()">⬅ Kembali ke Menu Utama</button>
        </div>
    </div>

            { q: "<ruby>今<rt>いま</rt></ruby>から <ruby>会議<rt>かいぎ</rt></ruby>が <ruby>始<rt>はじ</rt></ruby>まる（  ）です。", options: ["ところ", "ばかり", "はず", "だけ"], answer: 0 },
            { q: "<ruby>山田<rt>やまだ</rt></ruby>さんは <ruby>今日<rt>きょう</rt></ruby> <ruby>休<rt>やす</rt></ruby>むと <ruby>言<rt>い</rt></ruby>っていましたから、<ruby>来<rt>こ</rt></ruby>ない（  ）です。", options: ["はず", "つもり", "こと", "ため"], answer: 0 },
            { q: "<ruby>明日<rt>あした</rt></ruby>は <ruby>雪<rt>ゆき</rt></ruby>が <ruby>降<rt>ふ</rt></ruby>る（  ）しれません。", options: ["かも", "はず", "にちがい", "ことか"], answer: 0 },
            { q: "<ruby>週末<rt>しゅうまつ</rt></ruby>は <ruby>海<rt>うみ</rt></ruby>へ <ruby>行<rt>い</rt></ruby>こうと（  ）います。", options: ["<ruby>思<rt>おも</rt></ruby>って", "<ruby>考<rt>かんが</rt></ruby>えて", "<ruby>言<rt>い</rt></ruby>って", "<ruby>見<rt>み</rt></ruby>て"], answer: 0 }
        ];

        let jlptDB = [...originalDB];
        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswered = false;
        
        // Timer settings (35 minutes for Vocab/Grammar)
        let timeLeft = 35 * 60; 
        let timerInterval;

        const optionsContainer = document.getElementById('options-container');
        const btnNext = document.getElementById('btn-next');
        const progressText = document.getElementById('progress-text');
        const questionText = document.getElementById('question-text');
        const timerDisplay = document.getElementById('timer-display');

        function startTimer() {
            clearInterval(timerInterval); // Bersihkan interval yang ada sebelumnya
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.textContent = "00:00";
                    alert("Waktu habis! Ujian JLPT N4 selesai otomatis.");
                    showResult();
                } else {
                    timeLeft--;
                    let m = Math.floor(timeLeft / 60);
                    let s = timeLeft % 60;
                    timerDisplay.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    
                    if(timeLeft < 300) { // Merah saat sisa < 5 menit
                        timerDisplay.classList.add('warning');
                    }
                }
            }, 1000);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function shuffleQuiz() {
            if(confirm("Apakah Anda yakin ingin mengacak ulang soal? Ujian akan dimulai dari awal.")) {
                // Sembunyikan layar hasil jika tombol ditekan dari layar akhir
                document.getElementById('result-screen').style.display = "none";
                document.getElementById('quiz-screen').style.display = "block";
                
                shuffleArray(jlptDB);
                currentQuestionIndex = 0;
                score = 0;
                timeLeft = 35 * 60;
                timerDisplay.classList.remove('warning');
                
                loadQuestion();
                startTimer();
            }
        }

        function loadQuestion() {
            isAnswered = false;
            btnNext.style.display = "none";
            progressText.textContent = `${currentQuestionIndex + 1}/${jlptDB.length}`;
            
            const currentQ = jlptDB[currentQuestionIndex];
            // Format pengganti blank '（  ）'
            questionText.innerHTML = currentQ.q.replace("（  ）", "<span class='blank'></span>");
            optionsContainer.innerHTML = "";

            currentQ.options.forEach((optionHTML, index) => {
                const btn = document.createElement("button");
                btn.className = "btn-option";
                btn.innerHTML = `<strong>${index + 1}.</strong> &nbsp; ${optionHTML}`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (isAnswered) return; 
            isAnswered = true;

            const currentQ = jlptDB[currentQuestionIndex];
            const allButtons = optionsContainer.querySelectorAll('.btn-option');

            if (selectedIndex === currentQ.answer) {
                btnElement.classList.add('correct');
                score += (100 / jlptDB.length); // Total 100 poin dibagikan rata
            } else {
                btnElement.classList.add('wrong');
                allButtons[currentQ.answer].classList.add('correct');
            }

            allButtons.forEach(b => b.style.cursor = "default");
            
            // Fill in the blank jika ada
            if(currentQ.q.includes("（  ）")) {
                questionText.innerHTML = currentQ.q.replace(
                    "（  ）", 
                    `<span style="color: var(--accent-japan); border-bottom: 2px solid var(--accent-japan); padding: 0 5px; font-weight: bold; margin: 0 5px;">${currentQ.options[currentQ.answer]}</span>`
                );
            }
            
            btnNext.style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < jlptDB.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            clearInterval(timerInterval);
            document.getElementById('quiz-screen').style.display = "none";
            const resultScreen = document.getElementById('result-screen');
            resultScreen.style.display = "block";
            
            const finalScore = Math.round(score);
            document.getElementById('final-score').textContent = finalScore;
            
            const feedback = document.getElementById('feedback-message');
            // Ambang kelulusan JLPT untuk bagian ini biasanya 38 / 120 (proporsi sekitar 32%). Kita set pass di atas 38/100 poin.
            if (finalScore >= 80) {
                feedback.textContent = "Luar Biasa! Pemahaman Kosakata & Tata Bahasa Anda sangat kuat (A).";
                document.getElementById('final-score').style.color = "var(--accent-success)";
                feedback.style.color = "var(--accent-success)";
            } else if (finalScore >= 38) {
                feedback.textContent = "LULUS (Pass). Anda sudah memenuhi kriteria JLPT N4, tingkatkan terus!";
                document.getElementById('final-score').style.color = "#4caf50";
                feedback.style.color = "#4caf50";
            } else {
                feedback.textContent = "GAGAL (Fail). Skor Anda masih di bawah standar JLPT N4. Evaluasi lagi perbendaharaan Kanji & Pola Kalimat.";
                document.getElementById('final-score').style.color = "var(--accent-japan)";
                feedback.style.color = "var(--accent-japan)";
            }
        }

        window.onload = () => {
            loadQuestion();
            startTimer();
        };
    </script>
</body>
</html>
