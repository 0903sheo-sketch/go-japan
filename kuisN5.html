<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JLPT N5 Premium Grammar Test</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Poppins:wght@300;400;600&display=swap');

        :root {
            --bg-body: #f4f7f6;
            --bg-card: #ffffff;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --border-color: #dfe6e9;
            --primary: #0984e3;
            --primary-hover: #74b9ff;
            --success: #00b894;
            --danger: #d63031;
            --furigana-color: #0984e3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent; /* Hilangkan highlight biru di HP */
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Container & Cards */
        .container {
            width: 100%;
            max-width: 750px;
            position: relative;
        }

        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.05);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .hidden { display: none !important; }

        /* Typography */
        h1 { font-weight: 700; font-size: 28px; text-align: center; margin-bottom: 10px; color: var(--text-main); }
        h2, h3 { text-align: center; color: var(--text-main); margin-bottom: 20px; }
        p { text-align: center; color: var(--text-muted); margin-bottom: 30px; font-size: 15px; }
        
        /* Japanese Text Styling */
        .jp-text {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 24px;
            font-weight: 500;
            line-height: 2;
            text-align: center;
            margin-bottom: 30px;
        }

        ruby { ruby-align: center; }
        rt { font-size: 11px; color: var(--furigana-color); font-weight: 400; transform: translateY(-3px); }

        /* Mode Pro menyembunyikan furigana */
        .pro-mode rt { opacity: 0; visibility: hidden; display: none; }

        /* Inputs */
        input[type="text"] {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            margin-bottom: 20px;
            text-align: center;
            background: #fdfdfd;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(9, 132, 227, 0.1);
            background: #fff;
        }

        /* Buttons & Hover Animations */
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            font-family: 'Noto Sans JP', 'Poppins', sans-serif;
        }

        /* Hover efek desktop */
        @media (hover: hover) {
            .btn:hover {
                border-color: var(--primary);
                color: var(--primary);
                transform: translateY(-4px);
                box-shadow: 0 10px 20px rgba(9, 132, 227, 0.1);
            }
            .btn-primary:hover, .btn-mode:hover {
                background-color: var(--primary-hover);
                border-color: var(--primary-hover);
                color: white;
                box-shadow: 0 10px 20px rgba(9, 132, 227, 0.3);
            }
        }

        /* Sentuhan mobile (Tap/Active) */
        .btn:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            margin-top: 10px;
        }

        .mode-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn-mode {
            flex: 1;
            background: #fdfdfd;
            border-color: var(--border-color);
            color: var(--text-muted);
            padding: 20px 10px;
        }
        .btn-mode i { display: block; font-size: 24px; margin-bottom: 8px; color: var(--primary); }

        /* Timer UI */
        #timer-container {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            font-weight: 700;
            font-size: 18px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
            transition: color 0.3s;
        }
        .timer-danger {
            color: var(--danger) !important;
            animation: pulse 1s infinite;
        }

        /* Quiz Layout */
        #progress-container {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        .question-number {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            text-align: center;
            margin-bottom: 10px;
        }

        /* Result Layout */
        .status-badge {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 20px;
            color: white;
            margin: 20px auto;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .status-pass { background-color: var(--success); }
        .status-fail { background-color: var(--danger); }

        .mistake-list {
            text-align: left;
            margin-top: 30px;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 15px;
        }
        .mistake-item {
            background: #fff;
            border-left: 5px solid var(--danger);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
        }
        .mistake-q { font-size: 18px; margin-bottom: 10px; }
        .mistake-ans { color: var(--danger); font-size: 14px; margin-bottom: 5px; font-weight: 500;}
        .mistake-corr { color: var(--success); font-weight: bold; font-size: 14px; margin-bottom: 10px;}
        .mistake-ex { font-size: 13px; color: var(--text-muted); border-top: 1px dashed var(--border-color); padding-top: 10px;}

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ced6e0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a4b0be; }

        /* Animations */
        .fade-in { animation: fadeIn 0.5s forwards; }
        .slide-up { animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } 100% { transform: translateX(-50%) scale(1); } }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .card { padding: 30px 20px; border-radius: 20px; }
            .jp-text { font-size: 20px; }
            .btn { font-size: 15px; padding: 14px; }
            #timer-container { top: -50px; font-size: 16px; padding: 8px 20px; }
        }
    </style>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        
        <!-- Timer (Hidden initially) -->
        <div id="timer-container" class="hidden">
            <i class="fa-regular fa-clock"></i> <span id="time-display">20:00</span>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="card fade-in">
            <h1>JLPT N5 模擬試験</h1>
            <p>Latihan Grammar Premium • 40 Soal • Waktu 20 Menit</p>
            
            <input type="text" id="username" placeholder="Masukkan nama Anda..." autocomplete="off">
            
            <div class="mode-container">
                <button class="btn btn-mode" onclick="startQuiz('pemula')">
                    <i class="fa-solid fa-seedling" style="color: #00b894;"></i>
                    Mode Pemula<br><small style="font-size:11px; font-weight:400;">(Dengan Furigana)</small>
                </button>
                <button class="btn btn-mode" onclick="startQuiz('pro')">
                    <i class="fa-solid fa-fire" style="color: #d63031;"></i>
                    Mode Pro<br><small style="font-size:11px; font-weight:400;">(Tanpa Furigana)</small>
                </button>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="card hidden">
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
            <span class="question-number" id="question-indicator">Soal 1 / 40</span>
            <div id="question-text" class="jp-text slide-up"></div>
            <div id="options-container" class="slide-up" style="animation-delay: 0.1s;">
                <!-- Options JS -->
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="card hidden">
            <h2 id="result-name" style="margin-bottom: 5px;">Nama</h2>
            <p id="result-mode" style="margin-bottom: 20px; font-weight: 600;"></p>
            
            <h1 id="result-score" style="font-size: 56px; color: var(--primary);">0/40</h1>
            <p>Total Skor Anda</p>
            
            <div style="text-align: center;">
                <div id="result-status" class="status-badge">LULUS</div>
            </div>

            <button class="btn btn-primary" onclick="location.reload()" style="margin-top: 10px;">
                <i class="fa-solid fa-rotate-right"></i> Coba Lagi
            </button>

            <div id="review-section" class="hidden">
                <h3 style="margin-top: 40px; text-align: left; font-size: 18px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px;">
                    <i class="fa-solid fa-book-open"></i> Evaluasi Kesalahan:
                </h3>
                <div id="mistake-container" class="mistake-list">
                    <!-- Mistakes JS -->
                </div>
            </div>
        </div>

    </div>

    <script>
        // Database 40 Soal Grammar N5 dengan Ruby (Furigana)
        const quizData = [
            { q: "<ruby>私<rt>わたし</rt></ruby> ___ <ruby>学生<rt>がくせい</rt></ruby>です。", o: ["が", "は", "を", "に"], a: 1, ex: "Partikel 'は' (wa) digunakan untuk menandai subjek topik." },
            { q: "<ruby>机<rt>つくえ</rt></ruby>の <ruby>上<rt>うえ</rt></ruby> ___ ペンが あります。", o: ["に", "で", "へ", "を"], a: 0, ex: "Partikel 'に' menunjukkan letak keberadaan suatu benda." },
            { q: "<ruby>昨日<rt>きのう</rt></ruby>、デパート ___ <ruby>買<rt>か</rt></ruby>いものを しました。", o: ["に", "で", "へ", "と"], a: 1, ex: "Partikel 'で' menunjukkan tempat terjadinya suatu aksi." },
            { q: "<ruby>毎日<rt>まいにち</rt></ruby> ８<ruby>時<rt>じ</rt></ruby> ___ ねます。", o: ["から", "まで", "に", "で"], a: 2, ex: "Partikel 'に' digunakan untuk menunjukkan waktu yang spesifik." },
            { q: "これは <ruby>私<rt>わたし</rt></ruby> ___ <ruby>本<rt>ほん</rt></ruby>です。", o: ["の", "が", "は", "も"], a: 0, ex: "Partikel 'の' menunjukkan kepemilikan (Buku milik saya)." },
            { q: "<ruby>今日<rt>きょう</rt></ruby>は <ruby>雨<rt>あめ</rt></ruby> ___ ふって います。", o: ["を", "に", "が", "で"], a: 2, ex: "Fenomena alam selalu menggunakan partikel 'が' (あめがふります)." },
            { q: "<ruby>明日<rt>あした</rt></ruby>、<ruby>東京<rt>とうきょう</rt></ruby> ___ <ruby>行<rt>い</rt></ruby>きます。", o: ["を", "が", "で", "へ"], a: 3, ex: "Partikel 'へ' (e) atau 'に' menunjukkan arah/tujuan perpindahan." },
            { q: "りんご ___ みかんを <ruby>買<rt>か</rt></ruby>いました。", o: ["と", "や", "から", "まで"], a: 0, ex: "Partikel 'と' digunakan untuk menggabungkan kata benda spesifik (dan)." },
            { q: "パン ___ <ruby>食<rt>た</rt></ruby>べません。", o: ["が", "を", "は", "も"], a: 2, ex: "Dalam kalimat negatif, partikel 'を' sering diganti menjadi 'は' untuk penekanan." },
            { q: "この カメラは だれ ___ ですか。", o: ["の", "に", "が", "で"], a: 0, ex: "だれの berarti 'milik siapa'." },
            { q: "いっしょに おちゃを ___。", o: ["<ruby>飲<rt>の</rt></ruby>みます", "<ruby>飲<rt>の</rt></ruby>みませんか", "<ruby>飲<rt>の</rt></ruby>みました", "<ruby>飲<rt>の</rt></ruby>んで"], a: 1, ex: "～ませんか digunakan untuk mengajak dengan sopan (Maukah minum...?)." },
            { q: "ここに なまえを ___ ください。", o: ["<ruby>書<rt>か</rt></ruby>く", "<ruby>書<rt>か</rt></ruby>いて", "<ruby>書<rt>か</rt></ruby>き", "<ruby>書<rt>か</rt></ruby>かない"], a: 1, ex: "Pola meminta tolong (～てください) menggunakan kata kerja bentuk-Te." },
            { q: "<ruby>明日<rt>あした</rt></ruby>は <ruby>休<rt>やす</rt></ruby>み ___。", o: ["です", "でした", "ではありません", "ではありませんでした"], a: 0, ex: "Membicarakan masa depan (besok) menggunakan bentuk masa kini/positif (です)." },
            { q: "<ruby>昨日<rt>きのう</rt></ruby>の テストは ___。", o: ["むずかしいです", "むずかしいでした", "むずかしくないです", "むずかしかったです"], a: 3, ex: "Bentuk lampau (kemarin) dari kata sifat-i (むずかしい) adalah ～かったです." },
            { q: "この <ruby>町<rt>まち</rt></ruby>は ___ です。", o: ["しずか", "しずかな", "しずかに", "しずかだ"], a: 0, ex: "Di akhir kalimat bersanding dengan です, kata sifat-na membuang akhiran 'な'." },
            { q: "えいがを ___ たいです。", o: ["<ruby>見<rt>み</rt></ruby>る", "<ruby>見<rt>み</rt></ruby>て", "<ruby>見<rt>み</rt></ruby>", "<ruby>見<rt>み</rt></ruby>ます"], a: 2, ex: "Pola ～たい (ingin) menggabungkan bentuk Masu (masu dibuang) + たい." },
            { q: "あの <ruby>人<rt>ひと</rt></ruby>は ___ ないです。", o: ["<ruby>元気<rt>げんき</rt></ruby>", "<ruby>元気<rt>げんき</rt></ruby>な", "<ruby>元気<rt>げんき</rt></ruby>では", "<ruby>元気<rt>げんき</rt></ruby>だ"], a: 2, ex: "Bentuk negatif dari kata sifat-na adalah ～ではありません atau ～ではないです." },
            { q: "<ruby>車<rt>くるま</rt></ruby>の <ruby>中<rt>なか</rt></ruby>に だれか ___ か。", o: ["あります", "います", "します", "なります"], a: 1, ex: "Untuk keberadaan manusia/hewan (benda hidup), gunakan います." },
            { q: "<ruby>本<rt>ほん</rt></ruby>を ___ ながら ごはんを <ruby>食<rt>た</rt></ruby>べます。", o: ["<ruby>読<rt>よ</rt></ruby>む", "<ruby>読<rt>よ</rt></ruby>み", "<ruby>読<rt>よ</rt></ruby>んで", "<ruby>読<rt>よ</rt></ruby>まない"], a: 1, ex: "Pola ～ながら (sambil) menggunakan bentuk Masu (masu dibuang) + ながら." },
            { q: "もう しゅくだいを ___ か。", o: ["します", "しました", "して", "しません"], a: 1, ex: "'もう' (sudah) jika bermakna penyelesaian, diikuti kata kerja bentuk lampau (ました)." },
            { q: "としょかんで <ruby>本<rt>ほん</rt></ruby>を ___ は いけません。", o: ["<ruby>読<rt>よ</rt></ruby>む", "<ruby>読<rt>よ</rt></ruby>んで", "<ruby>読<rt>よ</rt></ruby>んでは", "<ruby>読<rt>よ</rt></ruby>まなくて"], a: 2, ex: "Pola melarang melakukan sesuatu adalah kata kerja bentuk-Te + はいけません." },
            { q: "<ruby>明日<rt>あした</rt></ruby>は ___ いいです。", o: ["はれると", "はれた", "はれる", "はれるから"], a: 0, ex: "Pola ～といいです menyatakan harapan (Semoga besok cerah)." },
            { q: "くつを ___ まま、へやに <ruby>入<rt>はい</rt></ruby>りました。", o: ["はく", "はいた", "はいて", "はかない"], a: 1, ex: "Pola ～まま (membiarkan dalam keadaan) menggunakan kata kerja bentuk-Ta." },
            { q: "<ruby>私<rt>わたし</rt></ruby>は ギターを ___ ことが できます。", o: ["ひく", "ひきます", "ひいて", "ひいた"], a: 0, ex: "Pola bisa melakukan sesuatu: Kata kerja bentuk Kamus (ひく) + ことができます." },
            { q: "えきまで バスで ３０<ruby>分<rt>ぷん</rt></ruby> ___ かかります。", o: ["ごろ", "ぐらい", "しか", "だけ"], a: 1, ex: "'ぐらい' digunakan untuk perkiraan durasi/jumlah (sekitar 30 menit). 'ごろ' untuk waktu yang ditunjuk." },
            { q: "スミスさんは <ruby>日本語<rt>にほんご</rt></ruby>が ___ なりました。", o: ["じょうず", "じょうずな", "じょうずに", "じょうずく"], a: 2, ex: "Perubahan keadaan dengan kata sifat-na menggunakan 'に' + なります." },
            { q: "さむいから、まどを ___ ください。", o: ["あけないで", "あけなくて", "あけない", "あける"], a: 0, ex: "Pola tolong JANGAN lakukan: Kata kerja bentuk-Nai + でください." },
            { q: "かぜを ___ から、がっこうを <ruby>休<rt>やす</rt></ruby>みます。", o: ["ひく", "ひいた", "ひいて", "ひきます"], a: 1, ex: "Menyatakan alasan atas hal yang sudah terjadi (sudah masuk angin), gunakan bentuk Ta." },
            { q: "この カレーは ___ すぎます。", o: ["からい", "から", "からく", "からかった"], a: 1, ex: "Pola ～すぎます (terlalu): kata sifat-i membuang akhiran 'い'." },
            { q: "ラジオを ___ ながら べんきょうします。", o: ["きく", "きき", "きいて", "きかない"], a: 1, ex: "Sama seperti no.19, bentuk Masu (tanpa masu) + ながら." },
            { q: "<ruby>日曜日<rt>にちようび</rt></ruby>、どこへ ___ <ruby>行<rt>い</rt></ruby>きませんでした。", o: ["も", "か", "は", "が"], a: 0, ex: "Kata tanya (どこ) + も + kata kerja negatif berarti 'tidak ke mana-mana'." },
            { q: "コーヒー ___ こうちゃ、どちらが いいですか。", o: ["と", "や", "から", "より"], a: 0, ex: "Menanyakan pilihan dari dua benda menggunakan pola A と B と." },
            { q: "<ruby>私<rt>わたし</rt></ruby>は いぬ ___ ねこが すきです。", o: ["より", "から", "ほど", "まで"], a: 0, ex: "Menyatakan perbandingan 'A lebih disukai dari B' menggunakan B より A がすきです." },
            { q: "あの かばんは ___ ないです。", o: ["たかい", "たかく", "たかくて", "たか"], a: 1, ex: "Bentuk negatif kata sifat-i: akhiran 'い' diubah menjadi 'くない'." },
            { q: "へやを ___ しましょう。", o: ["きれいに", "きれいな", "きれいく", "きれいだ"], a: 0, ex: "Membuat menjadi suatu keadaan (kata sifat-na): ～に します." },
            { q: "じしょは かばんの <ruby>中<rt>なか</rt></ruby>に ___。", o: ["あります", "います", "します", "なります"], a: 0, ex: "Untuk benda mati/tidak bernyawa, gunakan あります." },
            { q: "<ruby>昨日<rt>きのう</rt></ruby>、ともだち ___ えいがを <ruby>見<rt>み</rt></ruby>ました。", o: ["と", "に", "を", "へ"], a: 0, ex: "Melakukan aksi 'bersama' seseorang menggunakan partikel 'と'." },
            { q: "あの ケーキは ___ そうです。", o: ["おいしい", "おいし", "おいしく", "おいしかった"], a: 1, ex: "Pola 'kelihatannya' (～そうです): pada kata sifat-i membuang huruf terakhir 'い'." },
            { q: "<ruby>電車<rt>でんしゃ</rt></ruby>が ___ います。", o: ["くる", "き", "きて", "こない"], a: 2, ex: "Keadaan yang sedang berlangsung menggunakan kata kerja bentuk-Te + います." },
            { q: "もう すこし ___ はなして ください。", o: ["ゆっくり", "ゆっくりと", "ゆっくりに", "ゆっくりな"], a: 0, ex: "'ゆっくり' (perlahan) adalah adverbia yang bisa langsung diletakkan sebelum kata kerja." }
        ];

        let currentQuestion = 0;
        let score = 0;
        let userName = "";
        let userMistakes = [];
        let timeRemaining = 20 * 60; // 20 Menit dalam detik
        let timerInterval;

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const progressBar = document.getElementById('progress-bar');
        const questionIndicator = document.getElementById('question-indicator');
        const timerContainer = document.getElementById('timer-container');
        const timeDisplay = document.getElementById('time-display');

        function startQuiz(mode) {
            const nameInput = document.getElementById('username').value.trim();
            userName = nameInput === "" ? "Peserta Anonim" : nameInput;
            
            // Atur Mode Furigana
            if(mode === 'pro') {
                document.body.classList.add('pro-mode');
                document.getElementById('result-mode').innerText = "Mode Pro (Tanpa Furigana)";
            } else {
                document.body.classList.remove('pro-mode');
                document.getElementById('result-mode').innerText = "Mode Pemula (Dengan Furigana)";
            }

            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            timerContainer.classList.remove('hidden');
            
            startTimer();
            loadQuestion();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                let m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
                let s = (timeRemaining % 60).toString().padStart(2, '0');
                timeDisplay.innerText = `${m}:${s}`;

                if(timeRemaining <= 180) { // Sisa 3 Menit
                    timerContainer.classList.add('timer-danger');
                }

                if(timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    showResults();
                }
            }, 1000);
        }

        function loadQuestion() {
            // Reset Animasi
            questionText.classList.remove('slide-up');
            optionsContainer.classList.remove('slide-up');
            void questionText.offsetWidth; 
            questionText.classList.add('slide-up');
            optionsContainer.classList.add('slide-up');

            const current = quizData[currentQuestion];
            questionIndicator.innerText = `Soal ${currentQuestion + 1} / ${quizData.length}`;
            questionText.innerHTML = current.q; // Menggunakan innerHTML agar tag <ruby> terbaca
            optionsContainer.innerHTML = "";

            current.o.forEach((option, index) => {
                const button = document.createElement('button');
                button.classList.add('btn');
                button.innerHTML = option;
                button.onclick = () => selectAnswer(index);
                optionsContainer.appendChild(button);
            });

            const progress = ((currentQuestion) / quizData.length) * 100;
            progressBar.style.width = progress + '%';
        }

        function selectAnswer(selectedIndex) {
            const current = quizData[currentQuestion];
            
            if (selectedIndex === current.a) {
                score++;
            } else {
                userMistakes.push({
                    q: current.q,
                    wrong: current.o[selectedIndex],
                    correct: current.o[current.a],
                    explanation: current.ex
                });
            }

            currentQuestion++;

            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            clearInterval(timerInterval);
            timerContainer.classList.add('hidden');
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            
            // Animasi Fade-in hasil
            resultScreen.classList.add('fade-in');
            progressBar.style.width = '100%';

            document.getElementById('result-name').innerText = userName;
            document.getElementById('result-score').innerText = `${score}/${quizData.length}`;

            const statusBadge = document.getElementById('result-status');
            // Sistem Lulus >= 50% (20 soal benar)
            if (score >= 20) {
                statusBadge.innerHTML = '<i class="fa-solid fa-check"></i> LULUS (合格)';
                statusBadge.className = "status-badge status-pass";
            } else {
                statusBadge.innerHTML = '<i class="fa-solid fa-xmark"></i> TIDAK LULUS (不合格)';
                statusBadge.className = "status-badge status-fail";
            }

            if (userMistakes.length > 0) {
                document.getElementById('review-section').classList.remove('hidden');
                const mistakeContainer = document.getElementById('mistake-container');
                
                userMistakes.forEach(mistake => {
                    const div = document.createElement('div');
                    div.className = 'mistake-item';
                    div.innerHTML = `
                        <div class="mistake-q jp-text" style="font-size:20px; text-align:left; margin-bottom: 15px;">${mistake.q}</div>
                        <div class="mistake-ans"><i class="fa-solid fa-xmark"></i> Jawaban Anda: ${mistake.wrong}</div>
                        <div class="mistake-corr"><i class="fa-solid fa-check"></i> Jawaban Benar: ${mistake.correct}</div>
                        <div class="mistake-ex">💡 <b>Penjelasan:</b> ${mistake.explanation}</div>
                    `;
                    mistakeContainer.appendChild(div);
                });
            }
        }
    </script>
</body>
</html>
