<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kejutan!</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: black; 
            overflow: hidden; /* Menghilangkan scrollbar */
        }

        #jumpscare-container {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            z-index: 9999;
        }

        #jumpscare-container img {
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* Memastikan gambar menutupi seluruh layar */
        }
    </style>
</head>
<body>

    <div id="jumpscare-container">
        <img src="https://media1.tenor.com/m/FTsvcVV2mDoAAAAC/gugugaga-penguin.gif" alt="Teletubbies">
        
        <audio id="suara-kaget" src="https://www.myinstants.com/media/sounds/fnaf-scream.mp3" autoplay></audio>
    </div>

    <script>
        // Skrip untuk mencoba memaksa audio berputar saat halaman dimuat
        window.onload = function() {
            var audio = document.getElementById('suara-kaget');
            audio.volume = 1.0;
            
            // Mencoba memutar audio
            audio.play().catch(function(error) {
                console.log("Browser memblokir pemutaran suara otomatis. Korban harus mengklik layar agar suara keluar.");
            });
            
            // Trik tambahan: jika korban terkejut dan mengklik area manapun, suara akan langsung berbunyi
            document.body.addEventListener('click', function() {
                audio.play();
            });
        };
    </script>

</body>
</html>
